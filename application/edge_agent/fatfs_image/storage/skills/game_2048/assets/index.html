<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>2048</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="background background-a"></div>
    <div class="background background-b"></div>
    <main class="shell">
      <section class="hero">
        <div class="title-wrap">
          <p class="eyebrow">ESP-Claw Arcade</p>
          <h1>2048</h1>
          <p class="subtitle">上下左右一滑，数字相遇就会变大。</p>
        </div>
        <div class="scoreboard">
          <article class="score-card">
            <span class="score-label">分数</span>
            <strong id="score">0</strong>
          </article>
          <article class="score-card">
            <span class="score-label">最高分</span>
            <strong id="best">0</strong>
          </article>
        </div>
      </section>

      <section class="panel">
        <div class="panel-top">
          <p id="status" class="status">向任意方向滑动开始。</p>
          <button id="restart" class="restart-button" type="button">重新开始</button>
        </div>

        <div class="board-frame">
          <div id="board" class="board" aria-label="2048 game board"></div>
          <div id="overlay" class="overlay hidden" aria-live="polite">
            <div class="overlay-card">
              <p id="overlay-tag" class="overlay-tag"></p>
              <h2 id="overlay-title"></h2>
              <p id="overlay-text"></p>
              <div class="overlay-actions">
                <button id="continue" class="action-button ghost hidden" type="button">继续挑战</button>
                <button id="overlay-restart" class="action-button" type="button">再来一局</button>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="controls-pad">
            <button type="button" class="dir-button up" data-dir="up" aria-label="Move up">↑</button>
            <button type="button" class="dir-button left" data-dir="left" aria-label="Move left">←</button>
            <button type="button" class="dir-button down" data-dir="down" aria-label="Move down">↓</button>
            <button type="button" class="dir-button right" data-dir="right" aria-label="Move right">→</button>
          </div>
          <p class="controls-text">支持手势滑动、方向键、WASD。</p>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
